<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Patio</title>
<style>
  :root{--verde:#14532d;--fondo:#f3f4f1;--tinta:#1a1a1a;--gris:#5f6368;--linea:#d9dbd4}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--fondo);color:var(--tinta);padding:16px;max-width:520px;margin-inline:auto}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  h1{font-size:1.4rem;margin:0}
  #estado{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:99px}
  .on{background:#d1fae5;color:#065f46}.off{background:#fee2e2;color:#991b1b}
  button{font:inherit;border:0;border-radius:14px;cursor:pointer}
  #agregar{width:100%;padding:22px;font-size:1.3rem;font-weight:700;background:var(--verde);color:#fff}
  .hoy{margin:14px 0;color:var(--gris)}
  .hoy b{color:var(--tinta)}
  #form{display:none;background:#fff;border:1px solid var(--linea);border-radius:16px;padding:16px;margin-top:14px}
  #form h2{font-size:1rem;margin:0 0 10px}
  .opciones{display:grid;gap:10px;margin-bottom:14px}
  .op{padding:18px;font-size:1.1rem;background:var(--fondo);border:2px solid var(--linea);text-align:left}
  .op.sel{border-color:var(--verde);background:#e3efe6;font-weight:700}
  .fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tarifa{font-size:1.1rem;margin:0 0 14px}
  #guardar{width:100%;padding:18px;font-size:1.15rem;font-weight:700;background:var(--verde);color:#fff}
  #guardar:disabled{background:#9ca3a0}
  #cancelar{width:100%;padding:12px;margin-top:8px;background:none;color:var(--gris)}
  ul{list-style:none;padding:0;margin:0}
  li{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--linea)}
  li small{color:var(--gris);display:block}
  .vacio{color:var(--gris);padding:14px 0}
  #aviso{position:fixed;left:16px;right:16px;bottom:16px;background:var(--verde);color:#fff;padding:14px;border-radius:12px;text-align:center;font-weight:600;display:none;max-width:488px;margin-inline:auto}
</style>
</head>
<body>
<header><h1>Patio</h1><span id="estado"></span></header>

<button id="agregar">Agregar vehículo</button>
<p class="hoy" id="resumen"></p>

<section id="form">
  <h2>¿Qué barco / trabajo?</h2>
  <div class="opciones" id="barcos"></div>
  <div id="sucha" style="display:none">
    <h2>¿Cuánto?</h2>
    <div class="fila" id="montos">
      <button class="op" data-m="200">RD$200</button>
      <button class="op" data-m="400">RD$400</button>
    </div>
    <div style="height:14px"></div>
  </div>
  <p class="tarifa" id="tarifa"></p>
  <button id="guardar" disabled>Guardar</button>
  <button id="cancelar">Cancelar</button>
</section>

<h2 style="font-size:1rem;margin:22px 0 4px">Últimos registros</h2>
<ul id="lista"></ul>
<div id="aviso"></div>

<script>
const BARCOS={'Auto Prestige':71,'Ferry':91,'Sucha':null};
let barco=null,monto=null,db;

// ---------- Base de datos local (IndexedDB) ----------
function abrirDB(){return new Promise((ok,mal)=>{
  const r=indexedDB.open('patio',1);
  r.onupgradeneeded=()=>{const d=r.result;
    d.createObjectStore('vehiculos',{keyPath:'num'});
    d.createObjectStore('meta',{keyPath:'k'});};
  r.onsuccess=()=>{db=r.result;ok();};
  r.onerror=()=>mal(r.error);
});}

// Asigna el número y guarda en UNA sola transacción: no se salta ni repite números
function guardarVehiculo(barco,tarifa){return new Promise((ok,mal)=>{
  const t=db.transaction(['vehiculos','meta'],'readwrite');
  const meta=t.objectStore('meta'),veh=t.objectStore('vehiculos');
  meta.get('contador').onsuccess=e=>{
    const num=(e.target.result?e.target.result.v:0)+1;
    meta.put({k:'contador',v:num});
    const reg={num,id:'C'+num,fecha:new Date().toISOString(),barco,tarifa,sincronizado:false};
    veh.put(reg);
    t.oncomplete=()=>ok(reg);
  };
  t.onerror=()=>mal(t.error);
});}

function todos(){return new Promise(ok=>{
  db.transaction('vehiculos').objectStore('vehiculos').getAll().onsuccess=e=>ok(e.target.result);
});}

// ---------- Pantalla ----------
const $=id=>document.getElementById(id);
const rd=n=>'RD$'+n.toLocaleString('es-DO');

function dibujarBarcos(){
  $('barcos').innerHTML='';
  for(const b of Object.keys(BARCOS)){
    const x=document.createElement('button');x.className='op';x.textContent=b;
    x.onclick=()=>elegirBarco(b);x.dataset.b=b;$('barcos').appendChild(x);
  }
}
function elegirBarco(b){
  barco=b;monto=BARCOS[b];
  document.querySelectorAll('#barcos .op').forEach(x=>x.classList.toggle('sel',x.dataset.b===b));
  $('sucha').style.display=b==='Sucha'?'block':'none';
  document.querySelectorAll('#montos .op').forEach(x=>x.classList.remove('sel'));
  refrescarTarifa();
}
document.querySelectorAll('#montos .op').forEach(x=>x.onclick=()=>{
  monto=Number(x.dataset.m);
  document.querySelectorAll('#montos .op').forEach(y=>y.classList.toggle('sel',y===x));
  refrescarTarifa();
});
function refrescarTarifa(){
  $('tarifa').textContent=monto?('Tarifa: '+rd(monto)):'';
  $('guardar').disabled=!(barco&&monto);
}
function abrirForm(){barco=null;monto=null;dibujarBarcos();$('sucha').style.display='none';refrescarTarifa();$('form').style.display='block';$('agregar').style.display='none';}
function cerrarForm(){$('form').style.display='none';$('agregar').style.display='block';}
$('agregar').onclick=abrirForm;
$('cancelar').onclick=cerrarForm;
$('guardar').onclick=async()=>{
  $('guardar').disabled=true;
  const r=await guardarVehiculo(barco,monto);
  cerrarForm();aviso('Guardado: '+r.id+' · '+r.barco+' · '+rd(r.tarifa));
  await pintar();
};
function aviso(t){const a=$('aviso');a.textContent=t;a.style.display='block';setTimeout(()=>a.style.display='none',2500);}

async function pintar(){
  const v=(await todos()).sort((a,b)=>b.num-a.num);
  const hoy=new Date().toDateString();
  const deHoy=v.filter(x=>new Date(x.fecha).toDateString()===hoy);
  $('resumen').innerHTML='Hoy: <b>'+deHoy.length+'</b> vehículos · <b>'+rd(deHoy.reduce((s,x)=>s+x.tarifa,0))+'</b>';
  const ul=$('lista');ul.innerHTML='';
  if(!v.length){ul.innerHTML='<div class="vacio">Aún no hay registros. Pulsa «Agregar vehículo».</div>';return;}
  for(const x of v.slice(0,20)){
    const li=document.createElement('li');
    const f=new Date(x.fecha).toLocaleString('es-DO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    li.innerHTML='<div><b>'+x.id+'</b> · '+x.barco+'<small>'+f+'</small></div><div><b>'+rd(x.tarifa)+'</b></div>';
    ul.appendChild(li);
  }
}

function estado(){const e=$('estado');e.textContent=navigator.onLine?'Con internet':'Sin internet';e.className=navigator.onLine?'on':'off';}
addEventListener('online',estado);addEventListener('offline',estado);estado();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
abrirDB().then(pintar);
</script>
</body>
</html>
