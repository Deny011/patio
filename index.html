<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14532d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Patio</title>
<style>
  :root{--verde:#14532d;--fondo:#f3f4f1;--tinta:#1a1a1a;--gris:#5f6368;--linea:#d9dbd4}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--fondo);color:var(--tinta);padding:16px 16px 90px;max-width:520px;margin-inline:auto}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  h1{font-size:1.4rem;margin:0}
  h2{font-size:1rem;margin:0 0 10px}
  #estado{font-size:.8rem;font-weight:600;padding:4px 10px;border-radius:99px}
  .on{background:#d1fae5;color:#065f46}.off{background:#fee2e2;color:#991b1b}
  button{font:inherit;border:0;border-radius:14px;cursor:pointer}
  #agregar{width:100%;padding:22px;font-size:1.3rem;font-weight:700;background:var(--verde);color:#fff}
  #nuevoBarco{width:100%;padding:14px;margin-top:8px;font-weight:600;background:#fff;color:var(--verde);border:2px solid var(--verde)}
  .hoy{margin:14px 0;color:var(--gris)}
  .hoy b{color:var(--tinta)}
  .caja{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:16px;margin-top:14px}
  .secc{display:none}
  .opciones{display:grid;gap:10px;margin-bottom:14px}
  .op{padding:16px;font-size:1.05rem;background:var(--fondo);border:2px solid var(--linea);text-align:left}
  .op small{display:block;color:var(--gris);font-weight:400;margin-top:2px}
  .op.sel{border-color:var(--verde);background:#e3efe6;font-weight:700}
  .fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tarifa{font-size:1.1rem;margin:0 0 14px}
  .principal{width:100%;padding:18px;font-size:1.15rem;font-weight:700;background:var(--verde);color:#fff}
  .principal:disabled{background:#9ca3a0}
  .cancelar{width:100%;padding:12px;margin-top:8px;background:none;color:var(--gris)}
  label{display:block;font-weight:600;margin:0 0 6px}
  input[type=text],input[type=number]{width:100%;padding:14px;font-size:1.05rem;border:2px solid var(--linea);border-radius:12px;background:#fff;margin-bottom:12px}
  .codigo{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start}
  #escanear{padding:14px 16px;background:var(--verde);color:#fff;font-weight:700}
  #fotoBtn{width:100%;padding:18px;font-size:1.1rem;font-weight:700;background:#fff;color:var(--verde);border:2px dashed var(--verde);margin-bottom:10px}
  #prev{display:none;margin-bottom:14px;text-align:center}
  #prev img{max-width:100%;max-height:220px;border-radius:12px;border:1px solid var(--linea)}
  #prev button{display:block;margin:6px auto 0;background:none;color:var(--gris);padding:6px 10px;text-decoration:underline}
  .tarjeta{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--linea)}
  .tarjeta:last-child{border-bottom:0}
  .tarjeta small{display:block;color:var(--gris)}
  .cerrar{background:none;color:var(--gris);text-decoration:underline;padding:8px}
  ul{list-style:none;padding:0;margin:0}
  li{display:flex;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--linea)}
  li small{color:var(--gris);display:block}
  li img{width:52px;height:52px;object-fit:cover;border-radius:8px;margin-right:12px;cursor:pointer}
  li .izq{display:flex;align-items:center}
  .vacio{color:var(--gris);padding:8px 0}
  #visor,#scan{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:9;padding:10px}
  #visor{align-items:center;justify-content:center}
  #visor img{max-width:100%;max-height:100%}
  #scan{flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center}
  #scan video{width:100%;max-height:60vh;border-radius:14px;background:#000}
  #scan button{padding:14px 28px;background:#fff;color:#000;font-weight:700}
  .cab{display:flex;align-items:center;gap:10px}
  #menuBtn{width:44px;height:44px;font-size:1.5rem;background:#fff;border:1px solid var(--linea);line-height:1}
  #velo{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:20}
  #drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:300px;background:#fff;z-index:21;padding:18px 14px;transform:translateX(-105%);transition:transform .2s}
  #drawer.abierto{transform:none}
  #drawer h3{margin:4px 8px 16px;font-size:1.1rem}
  #drawer button{display:block;width:100%;text-align:left;padding:16px 12px;font-size:1.05rem;background:none;border-radius:10px}
  #drawer button:active{background:var(--fondo)}
  #drawer hr{border:0;border-top:1px solid var(--linea);margin:12px 0}
  #drawer .peligro{color:#991b1b}
  .chips{display:flex;gap:8px;margin-bottom:12px}
  .chip{padding:8px 14px;background:#fff;border:1px solid var(--linea);border-radius:99px;font-size:.9rem}
  .chip.sel{background:var(--verde);color:#fff;border-color:var(--verde)}
  .tag{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;margin-left:6px}
  .tag.ab{background:#d1fae5;color:#065f46}.tag.ce{background:#e5e7eb;color:#4b5563}
  .click{cursor:pointer}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
  .stat{background:var(--fondo);border-radius:12px;padding:12px}
  .stat b{display:block;font-size:1.4rem}
  .volver{background:none;color:var(--verde);font-weight:600;padding:6px 0;margin-bottom:8px}
  .sec2{width:100%;padding:14px;margin-top:10px;font-weight:600;background:#fff;color:var(--verde);border:2px solid var(--verde)}
  .lineas{margin:8px 0 0}
  .lin{display:flex;justify-content:space-between;padding:5px 0}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .grid3 .op{text-align:center;padding:14px 4px}
  .dia{margin-top:22px;padding-bottom:6px;border-bottom:2px solid var(--verde)}
  .dia b{font-size:1.05rem;text-transform:capitalize}
  .borrar{background:none;color:#991b1b;text-decoration:underline;padding:6px 0 6px 12px}
  #aviso{position:fixed;left:16px;right:16px;bottom:16px;background:var(--verde);color:#fff;padding:14px;border-radius:12px;text-align:center;font-weight:600;display:none;max-width:488px;margin-inline:auto;z-index:10}
</style>
</head>
<body>
<header><div class="cab"><button id="menuBtn" aria-label="Menú">☰</button><h1>Patio</h1></div><span id="estado"></span></header>

<div id="velo"></div>
<nav id="drawer">
  <h3>Patio</h3>
  <button id="mInicio">🏠 Inicio</button>
  <button id="mBarcos">🚢 Barcos</button>
  <button id="mHist">📅 Historial</button>
  <hr>
  <button id="mBorrar" class="peligro">🗑 Borrar datos de prueba</button>
</nav>

<div id="home">
  <button id="agregar">Agregar vehículo</button>
  <button id="nuevoBarco">+ Nuevo barco</button>
  <button id="btnGaseo" class="sec2">Registrar gaseo</button>
  <div class="caja" id="resumen"></div>

  <h2>Barcos abiertos</h2>
  <div id="abiertos" class="caja" style="margin-top:0"></div>

  <h2 style="margin-top:22px">Últimos registros</h2>
  <ul id="lista"></ul>
  <button id="verHist" class="sec2">Ver historial completo</button>
</div>

<section id="formVeh" class="caja secc">
  <h2>¿De qué barco es?</h2>
  <div class="opciones" id="opsBarco"></div>
  <div id="sucha" style="display:none">
    <h2>¿Cuánto?</h2>
    <div class="fila" id="montos">
      <button class="op" data-m="200">RD$200</button>
      <button class="op" data-m="400">RD$400</button>
    </div>
    <div style="height:14px"></div>
  </div>
  <p class="tarifa" id="tarifa"></p>
  <h2>Foto del chasis o papel (opcional)</h2>
  <input type="file" id="fotoIn" accept="image/*" capture="environment" hidden>
  <button id="fotoBtn">📷 Tomar foto</button>
  <div id="prev"><img id="prevImg" alt="Vista previa"><button id="quitarFoto">Quitar foto</button></div>
  <button id="guardar" class="principal" disabled>Guardar</button>
  <button id="cancelar" class="cancelar">Cancelar</button>
</section>

<section id="formBarco" class="caja secc">
  <h2>¿Qué tipo de barco?</h2>
  <div class="opciones" id="tiposBarco"></div>
  <label for="codBarras">Código de barras</label>
  <div class="codigo">
    <input type="text" id="codBarras" autocomplete="off">
    <button id="escanear">📷 Escanear</button>
  </div>
  <label for="codNum">Código numérico</label>
  <input type="text" id="codNum" inputmode="numeric" autocomplete="off">
  <button id="guardarBarco" class="principal">Guardar barco</button>
  <button id="cancelarBarco" class="cancelar">Cancelar</button>
</section>

<section id="formGaseo" class="caja secc">
  <h2>Gaseo</h2>
  <label for="gFecha">Fecha</label>
  <input type="date" id="gFecha" style="width:100%;padding:14px;font-size:1.05rem;border:2px solid var(--linea);border-radius:12px;background:#fff;margin-bottom:14px">
  <h2>¿Cuánto pagan?</h2>
  <div class="grid3" id="montosG">
    <button class="op" data-m="500">RD$500</button>
    <button class="op" data-m="1000">RD$1,000</button>
    <button class="op" data-m="1100">RD$1,100</button>
    <button class="op" data-m="1200">RD$1,200</button>
    <button class="op" data-m="1500">RD$1,500</button>
  </div>
  <label for="gMonto">Otro monto</label>
  <input type="number" id="gMonto" inputmode="numeric" min="0" placeholder="Escribe el monto">
  <button id="guardarGaseo" class="principal" disabled>Guardar gaseo</button>
  <button id="cancelarGaseo" class="cancelar">Cancelar</button>
</section>

<section id="pHist" class="secc">
  <button class="volver" id="volverInicio">← Inicio</button>
  <h2 style="font-size:1.2rem">Historial</h2>
  <input type="text" id="buscarId" placeholder="Buscar por ID (ej. 25)" inputmode="numeric" autocomplete="off">
  <div id="histLista"></div>
</section>

<section id="pBarcos" class="secc">
  <h2 style="font-size:1.2rem">Barcos</h2>
  <input type="text" id="buscarBarco" placeholder="Buscar por código o tipo" autocomplete="off">
  <div class="chips" id="chips">
    <button class="chip sel" data-f="todos">Todos</button>
    <button class="chip" data-f="abiertos">Abiertos</button>
    <button class="chip" data-f="cerrados">Cerrados</button>
  </div>
  <div id="listaBarcos" class="caja" style="margin-top:0"></div>
</section>

<section id="pDetalle" class="secc">
  <button class="volver" id="volverBarcos">← Barcos</button>
  <div id="detalle"></div>
</section>

<div id="scan">
  <p>Apunta al código de barras</p>
  <video id="video" playsinline muted></video>
  <button id="cerrarScan">Cancelar</button>
</div>
<div id="visor"><img id="visorImg" alt="Foto"></div>
<div id="aviso"></div>

<script>
const $=id=>document.getElementById(id);
const rd=n=>'RD$'+n.toLocaleString('es-DO');
const TARIFAS={'Auto Prestige':71,'Ferry':91,'Sucha':null};
let db,barcoSel=null,monto=null,foto=null,fotoMini=null,visorUrl=null,tipoNuevo=null,urls=[],abiertos=[];

// ---------- Base de datos local (IndexedDB) ----------
function abrirDB(){return new Promise((ok,mal)=>{
  const r=indexedDB.open('patio',3);
  r.onupgradeneeded=()=>{const d=r.result;
    if(!d.objectStoreNames.contains('vehiculos'))d.createObjectStore('vehiculos',{keyPath:'num'});
    if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'k'});
    if(!d.objectStoreNames.contains('gaseos'))d.createObjectStore('gaseos',{keyPath:'gid',autoIncrement:true});
    if(!d.objectStoreNames.contains('barcos'))d.createObjectStore('barcos',{keyPath:'bid',autoIncrement:true});};
  r.onsuccess=()=>{db=r.result;ok();};
  r.onerror=()=>mal(r.error);
});}
function todos(store){return new Promise(ok=>{
  db.transaction(store).objectStore(store).getAll().onsuccess=e=>ok(e.target.result);
});}

function guardarBarco(reg){return new Promise((ok,mal)=>{
  const t=db.transaction('barcos','readwrite');
  const rq=t.objectStore('barcos').add(reg);
  t.oncomplete=()=>ok(rq.result);t.onerror=()=>mal(t.error);
});}
function estadoBarcoDB(bid,abierto){return new Promise((ok,mal)=>{
  const t=db.transaction('barcos','readwrite'),st=t.objectStore('barcos');
  st.get(bid).onsuccess=e=>{const b=e.target.result;if(b){b.abierto=abierto;b.cierre=abierto?null:new Date().toISOString();b.sincronizado=false;st.put(b);}};
  t.oncomplete=ok;t.onerror=()=>mal(t.error);
});}
function guardarGaseo(reg){return new Promise((ok,mal)=>{
  const t=db.transaction('gaseos','readwrite');t.objectStore('gaseos').add(reg);
  t.oncomplete=ok;t.onerror=()=>mal(t.error);
});}
function borrarGaseoDB(gid){return new Promise((ok,mal)=>{
  const t=db.transaction('gaseos','readwrite');t.objectStore('gaseos').delete(gid);
  t.oncomplete=ok;t.onerror=()=>mal(t.error);
});}
function borrarTodoDB(){return new Promise((ok,mal)=>{
  const t=db.transaction(['vehiculos','barcos','meta','gaseos'],'readwrite');
  ['vehiculos','barcos','meta','gaseos'].forEach(n=>t.objectStore(n).clear());
  t.oncomplete=ok;t.onerror=()=>mal(t.error);
});}

// Asigna el número y guarda en UNA sola transacción: no se salta ni repite números
function guardarVehiculo(b,tarifa,foto,mini){return new Promise((ok,mal)=>{
  const t=db.transaction(['vehiculos','meta'],'readwrite');
  const meta=t.objectStore('meta'),veh=t.objectStore('vehiculos');
  meta.get('contador').onsuccess=e=>{
    const num=(e.target.result?e.target.result.v:0)+1;
    meta.put({k:'contador',v:num});
    const reg={num,id:'C'+num,fecha:new Date().toISOString(),barco:b.tipo,barcoId:b.bid,
      codigo:b.codigoBarras||b.codigoNum||'',tarifa,foto:foto||null,mini:mini||null,sincronizado:false};
    veh.put(reg);
    t.oncomplete=()=>ok(reg);
  };
  t.onerror=()=>mal(t.error);
});}

// ---------- Utilidades de pantalla ----------
function aviso(t){const a=$('aviso');a.textContent=t;a.style.display='block';clearTimeout(aviso.t);aviso.t=setTimeout(()=>a.style.display='none',2800);}
function mostrar(id){['home','formVeh','formBarco','pBarcos','pDetalle','formGaseo','pHist'].forEach(x=>{
  const e=$(x);e.style.display=x===id?'block':'none';});window.scrollTo(0,0);}
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function nombreBarco(b){return b.tipo+' · '+(b.codigoBarras||b.codigoNum||'sin código');}

// ---------- Foto ----------
// Reduce a máx. 2000 px por lado (JPEG 85%): el VIN se lee bien y no llena el teléfono
async function procesarFoto(file){
  try{
    const bmp=await createImageBitmap(file);
    const k=Math.min(1,2000/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');
    c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(ok=>c.toBlob(b=>ok(b||file),'image/jpeg',0.85));
  }catch(e){return file;}
}
// Miniatura de 160 px para listas rápidas (la foto completa se abre al tocarla)
async function hacerMini(blob){
  try{
    const bmp=await createImageBitmap(blob);
    const k=Math.min(1,160/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');
    c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(ok=>c.toBlob(b=>ok(b),'image/jpeg',0.7));
  }catch(e){return null;}
}
let prevUrl=null;
function quitarFoto(){
  foto=null;fotoMini=null;if(prevUrl){URL.revokeObjectURL(prevUrl);prevUrl=null;}
  $('prev').style.display='none';$('fotoBtn').textContent='📷 Tomar foto';
}
$('fotoBtn').onclick=()=>$('fotoIn').click();
$('quitarFoto').onclick=quitarFoto;
$('fotoIn').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  foto=await procesarFoto(f);fotoMini=await hacerMini(foto);e.target.value='';
  if(prevUrl)URL.revokeObjectURL(prevUrl);
  prevUrl=URL.createObjectURL(foto);
  $('prevImg').src=prevUrl;$('prev').style.display='block';$('fotoBtn').textContent='📷 Tomar otra foto';
};
$('visor').onclick=()=>{$('visor').style.display='none';$('visorImg').src='';if(visorUrl){URL.revokeObjectURL(visorUrl);visorUrl=null;}};

// ---------- Agregar vehículo ----------
function dibujarOpsBarco(conteo){
  const c=$('opsBarco');c.innerHTML='';
  for(const b of abiertos){
    const x=el('button','op',b.tipo);x.dataset.bid=b.bid;
    x.appendChild(el('small','',(b.codigoBarras||b.codigoNum||'sin código')+' · '+(conteo[b.bid]||0)+' vehículos'));
    x.onclick=()=>elegirBarco(b);c.appendChild(x);
  }
}
function elegirBarco(b){
  barcoSel=b;monto=TARIFAS[b.tipo];
  document.querySelectorAll('#opsBarco .op').forEach(x=>x.classList.toggle('sel',Number(x.dataset.bid)===b.bid));
  $('sucha').style.display=b.tipo==='Sucha'?'block':'none';
  document.querySelectorAll('#montos .op').forEach(x=>x.classList.remove('sel'));
  refrescarTarifa();
}
document.querySelectorAll('#montos .op').forEach(x=>x.onclick=()=>{
  monto=Number(x.dataset.m);
  document.querySelectorAll('#montos .op').forEach(y=>y.classList.toggle('sel',y===x));
  refrescarTarifa();
});
function refrescarTarifa(){
  $('tarifa').textContent=monto?('Tarifa: '+rd(monto)):'';
  $('guardar').disabled=!(barcoSel&&monto);
}
async function abrirForm(){
  if(!abiertos.length){aviso('Primero agrega el barco');abrirFormBarco();return;}
  const v=await todos('vehiculos');
  const conteo={};let ult=null;
  for(const x of v){conteo[x.barcoId]=(conteo[x.barcoId]||0)+1;}
  // barco preseleccionado: el del último vehículo, si sigue abierto; si no, el más nuevo
  const ordenados=v.filter(x=>x.barcoId).sort((a,b)=>b.num-a.num);
  for(const x of ordenados){const b=abiertos.find(y=>y.bid===x.barcoId);if(b){ult=b;break;}}
  if(!ult)ult=abiertos[0];
  barcoSel=null;monto=null;quitarFoto();dibujarOpsBarco(conteo);
  $('sucha').style.display='none';refrescarTarifa();
  elegirBarco(ult);
  mostrar('formVeh');
}
$('agregar').onclick=abrirForm;
$('cancelar').onclick=()=>mostrar('home');
$('guardar').onclick=async()=>{
  $('guardar').disabled=true;
  const r=await guardarVehiculo(barcoSel,monto,foto,fotoMini);
  mostrar('home');aviso('Guardado: '+r.id+' · '+r.barco+' · '+rd(r.tarifa));
  await pintar();
};

// ---------- Nuevo barco ----------
function abrirFormBarco(){
  tipoNuevo=null;$('codBarras').value='';$('codNum').value='';
  const c=$('tiposBarco');c.innerHTML='';
  for(const t of Object.keys(TARIFAS)){
    const x=el('button','op',t);x.dataset.t=t;
    x.onclick=()=>{tipoNuevo=t;c.querySelectorAll('.op').forEach(y=>y.classList.toggle('sel',y===x));};
    c.appendChild(x);
  }
  mostrar('formBarco');
}
$('nuevoBarco').onclick=abrirFormBarco;
$('cancelarBarco').onclick=()=>mostrar('home');
$('guardarBarco').onclick=async()=>{
  const cb=$('codBarras').value.trim(),cn=$('codNum').value.trim();
  if(!tipoNuevo){aviso('Elige el tipo de barco');return;}
  if(!cb&&!cn){aviso('Escanea o escribe el código del barco');return;}
  const dup=abiertos.find(b=>(cb&&b.codigoBarras===cb)||(cn&&b.codigoNum===cn));
  if(dup){aviso('Ese barco ya está abierto');return;}
  await guardarBarco({tipo:tipoNuevo,codigoBarras:cb,codigoNum:cn,fecha:new Date().toISOString(),abierto:true,sincronizado:false});
  mostrar('home');aviso('Barco agregado: '+tipoNuevo);
  await pintar();
};

// ---------- Escáner de código de barras (funciona sin internet) ----------
let stream=null,escaneando=false;
function pararScan(){
  escaneando=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  $('video').srcObject=null;$('scan').style.display='none';
}
$('cerrarScan').onclick=pararScan;
$('escanear').onclick=async()=>{
  if(!('BarcodeDetector' in window)){aviso('Este teléfono no escanea desde la app. Escribe el código.');return;}
  let det;
  try{
    let f=[];try{f=await BarcodeDetector.getSupportedFormats();}catch(e){}
    det=new BarcodeDetector(f.length?{formats:f}:undefined);
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  }catch(e){aviso('No se pudo abrir la cámara. Revisa el permiso.');return;}
  const v=$('video');v.srcObject=stream;
  try{await v.play();}catch(e){}
  $('scan').style.display='flex';escaneando=true;
  while(escaneando){
    try{
      const r=await det.detect(v);
      if(r.length){
        $('codBarras').value=r[0].rawValue;
        if(navigator.vibrate)navigator.vibrate(120);
        pararScan();aviso('Código leído: '+r[0].rawValue);break;
      }
    }catch(e){}
    await new Promise(z=>setTimeout(z,250));
  }
};

// ---------- Pantalla principal ----------
async function pintar(){
  const v=(await todos('vehiculos')).sort((a,b)=>b.num-a.num);
  const bs=(await todos('barcos')).sort((a,b)=>b.bid-a.bid);
  abiertos=bs.filter(b=>b.abierto);
  const g=await todos('gaseos');
  const rs=resumenDia(v,g,claveDia(new Date().toISOString()));
  const rc=$('resumen');rc.innerHTML='';
  const tt=el('div');tt.appendChild(el('b','','Hoy'));tt.append(' · '+rs.n+(rs.n===1?' vehículo':' vehículos'));rc.appendChild(tt);
  if(rs.n||rs.gaseo)rc.appendChild(lineasResumen(rs));else rc.appendChild(el('small','','Sin movimientos todavía'));

  // barcos abiertos con su conteo
  const ab=$('abiertos');ab.innerHTML='';
  if(!abiertos.length)ab.appendChild(el('div','vacio','No hay barcos abiertos. Pulsa «+ Nuevo barco».'));
  for(const b of abiertos){
    const mios=v.filter(x=>x.barcoId===b.bid);
    const t=el('div','tarjeta');
    const izq=el('div','click');izq.onclick=()=>verDetalle(b.bid);
    izq.appendChild(el('b','',b.tipo));
    izq.appendChild(el('small','','Código: '+(b.codigoBarras||'—')+(b.codigoNum?' · Nº '+b.codigoNum:'')));
    izq.appendChild(el('small','',mios.length+' vehículos · '+rd(mios.reduce((s,x)=>s+x.tarifa,0))));
    t.appendChild(izq);
    const c=el('button','cerrar','Cerrar');
    c.onclick=async()=>{
      if(confirm('¿Cerrar el barco '+nombreBarco(b)+'? Ya no podrás agregarle vehículos.')){
        await estadoBarcoDB(b.bid,false);aviso('Barco cerrado');await pintar();}
    };
    t.appendChild(c);ab.appendChild(t);
  }

  // últimos registros
  urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
  const ul=$('lista');ul.innerHTML='';
  if(!v.length){ul.appendChild(el('div','vacio','Aún no hay registros. Pulsa «Agregar vehículo».'));return;}
  for(const x of v.slice(0,5))ul.appendChild(filaVeh(x,true));
}

function fmt(iso){return new Date(iso).toLocaleString('es-DO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function filaVeh(x,conBarco){
  const li=el('li');
  const izq=el('div','izq');
  if(x.foto){
    const u=URL.createObjectURL(x.mini||x.foto);urls.push(u);
    const im=el('img');im.src=u;im.alt='Foto '+x.id;
    im.onclick=()=>{visorUrl=URL.createObjectURL(x.foto);$('visorImg').src=visorUrl;$('visor').style.display='flex';};
    izq.appendChild(im);
  }
  const tx=el('div');
  tx.appendChild(el('b','',x.id));
  if(conBarco)tx.append(' · '+x.barco+(x.codigo?' · '+x.codigo:''));
  tx.appendChild(el('small','',fmt(x.fecha)));
  izq.appendChild(tx);li.appendChild(izq);
  li.appendChild(el('b','',rd(x.tarifa)));
  return li;
}

// ---------- Resúmenes por día ----------
function claveDia(iso){const d=new Date(iso);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function resumenDia(v,g,k){
  const r={n:0,tipos:{},gaseo:0};
  for(const x of v){if(claveDia(x.fecha)!==k)continue;r.n++;const t=r.tipos[x.barco]||(r.tipos[x.barco]={n:0,monto:0});t.n++;t.monto+=x.tarifa;}
  for(const y of g){if(claveDia(y.fecha)===k)r.gaseo+=y.monto;}
  return r;
}
function lineasResumen(r){
  const d=el('div','lineas');
  const fila=(a,b)=>{const f=el('div','lin');f.appendChild(el('span','',a));f.appendChild(el('b','',b));d.appendChild(f);};
  for(const t of Object.keys(r.tipos))fila(t+' · '+r.tipos[t].n+(r.tipos[t].n===1?' vehículo':' vehículos'),rd(r.tipos[t].monto));
  if(r.gaseo)fila('Gaseo',rd(r.gaseo));
  return d;
}
function etiquetaDia(k){
  const hoy=new Date();const ay=new Date();ay.setDate(ay.getDate()-1);
  if(k===claveDia(hoy.toISOString()))return 'Hoy';
  if(k===claveDia(ay.toISOString()))return 'Ayer';
  const [y,m,d]=k.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('es-DO',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}

// ---------- Gaseo ----------
function marcarMontoG(){
  const val=Number($('gMonto').value);
  document.querySelectorAll('#montosG .op').forEach(b=>b.classList.toggle('sel',Number(b.dataset.m)===val));
  $('guardarGaseo').disabled=!(val>0);
}
document.querySelectorAll('#montosG .op').forEach(b=>b.onclick=()=>{$('gMonto').value=b.dataset.m;marcarMontoG();});
$('gMonto').oninput=marcarMontoG;
$('btnGaseo').onclick=()=>{$('gFecha').value=claveDia(new Date().toISOString());$('gMonto').value='';marcarMontoG();mostrar('formGaseo');};
$('cancelarGaseo').onclick=()=>mostrar('home');
$('guardarGaseo').onclick=async()=>{
  const monto=Number($('gMonto').value);const f=$('gFecha').value;
  if(!(monto>0)||!f){aviso('Pon la fecha y el monto');return;}
  const existentes=(await todos('gaseos')).filter(y=>claveDia(y.fecha)===f);
  if(existentes.length&&!confirm('Ya hay un gaseo ese día ('+rd(existentes[0].monto)+'). ¿Agregar otro?'))return;
  const [y,m,d]=f.split('-').map(Number);
  const iso=f===claveDia(new Date().toISOString())?new Date().toISOString():new Date(y,m-1,d,12,0,0).toISOString();
  await guardarGaseo({fecha:iso,monto,sincronizado:false});
  mostrar('home');aviso('Gaseo guardado: '+rd(monto));await pintar();
};

// ---------- Historial por fecha ----------
let diasMostrados=7;
async function abrirHist(){$('buscarId').value='';diasMostrados=7;mostrar('pHist');await pintarHist();}
$('verHist').onclick=abrirHist;
$('mHist').onclick=()=>{cerrarMenu();abrirHist();};
$('volverInicio').onclick=async()=>{mostrar('home');await pintar();};
$('buscarId').oninput=()=>pintarHist();
async function pintarHist(){
  const v=(await todos('vehiculos')).sort((a,b)=>b.num-a.num);
  const g=await todos('gaseos');
  urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
  const c=$('histLista');c.innerHTML='';
  const q=$('buscarId').value.trim().toUpperCase();
  if(q){
    const res=v.filter(x=>x.id.toUpperCase().startsWith(q.startsWith('C')?q:'C'+q));
    const ul=el('ul');
    if(!res.length)ul.appendChild(el('div','vacio','No hay ningún vehículo con ese ID.'));
    res.slice(0,50).forEach(x=>ul.appendChild(filaVeh(x,true)));
    c.appendChild(ul);return;
  }
  const dias=[...new Set([...v.map(x=>claveDia(x.fecha)),...g.map(y=>claveDia(y.fecha))])].sort().reverse();
  if(!dias.length){c.appendChild(el('div','vacio','Todavía no hay registros.'));return;}
  for(const k of dias.slice(0,diasMostrados)){
    const r=resumenDia(v,g,k);
    const h=el('div','dia');
    const t=el('div');t.appendChild(el('b','',etiquetaDia(k)));t.append(' · '+r.n+(r.n===1?' vehículo':' vehículos'));
    h.appendChild(t);h.appendChild(lineasResumen(r));c.appendChild(h);
    const ul=el('ul');
    for(const y of g.filter(y=>claveDia(y.fecha)===k)){
      const li=el('li');li.appendChild(el('b','','Gaseo'));
      const der=el('div');der.appendChild(el('b','',rd(y.monto)));
      const bb=el('button','borrar','Borrar');
      bb.onclick=async()=>{if(confirm('¿Borrar el gaseo de '+rd(y.monto)+'?')){await borrarGaseoDB(y.gid);await pintarHist();}};
      der.appendChild(bb);li.appendChild(der);ul.appendChild(li);
    }
    v.filter(x=>claveDia(x.fecha)===k).forEach(x=>ul.appendChild(filaVeh(x,true)));
    c.appendChild(ul);
  }
  if(dias.length>diasMostrados){
    const m=el('button','sec2','Mostrar días anteriores');
    m.onclick=async()=>{diasMostrados+=7;await pintarHist();};c.appendChild(m);
  }
}

// ---------- Menú ----------
function abrirMenu(){$('velo').style.display='block';$('drawer').classList.add('abierto');}
function cerrarMenu(){$('velo').style.display='none';$('drawer').classList.remove('abierto');}
$('menuBtn').onclick=abrirMenu;$('velo').onclick=cerrarMenu;
$('mInicio').onclick=async()=>{cerrarMenu();mostrar('home');await pintar();};
$('mBarcos').onclick=async()=>{cerrarMenu();filtro='todos';$('buscarBarco').value='';marcarChip();mostrar('pBarcos');await pintarBarcos();};
$('mBorrar').onclick=async()=>{
  cerrarMenu();
  const r=prompt('Esto borra TODOS los vehículos, fotos y barcos, y el contador vuelve a C1. No se puede deshacer.\n\nEscribe BORRAR para confirmar:');
  if(r===null)return;
  if(r.trim().toUpperCase()!=='BORRAR'){aviso('No se borró nada');return;}
  await borrarTodoDB();mostrar('home');await pintar();aviso('Todo borrado. El próximo vehículo será C1');
};

// ---------- Lista de barcos y detalle ----------
let filtro='todos';
function marcarChip(){document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('sel',c.dataset.f===filtro));}
document.querySelectorAll('#chips .chip').forEach(c=>c.onclick=()=>{filtro=c.dataset.f;marcarChip();pintarBarcos();});
$('buscarBarco').oninput=()=>pintarBarcos();
$('volverBarcos').onclick=async()=>{mostrar('pBarcos');await pintarBarcos();};

async function pintarBarcos(){
  const v=await todos('vehiculos');
  let bs=(await todos('barcos')).sort((a,b)=>b.bid-a.bid);
  const q=$('buscarBarco').value.trim().toLowerCase();
  if(filtro==='abiertos')bs=bs.filter(b=>b.abierto);
  if(filtro==='cerrados')bs=bs.filter(b=>!b.abierto);
  if(q)bs=bs.filter(b=>(b.tipo+' '+b.codigoBarras+' '+b.codigoNum).toLowerCase().includes(q));
  const c=$('listaBarcos');c.innerHTML='';
  if(!bs.length){c.appendChild(el('div','vacio','No hay barcos que coincidan.'));return;}
  for(const b of bs){
    const mios=v.filter(x=>x.barcoId===b.bid);
    const t=el('div','tarjeta click');
    const izq=el('div');
    const l1=el('b','',b.tipo);
    l1.appendChild(el('span','tag '+(b.abierto?'ab':'ce'),b.abierto?'Abierto':'Cerrado'));
    izq.appendChild(l1);
    izq.appendChild(el('small','','Código: '+(b.codigoBarras||'—')+(b.codigoNum?' · Nº '+b.codigoNum:'')));
    izq.appendChild(el('small','',mios.length+' vehículos · '+rd(mios.reduce((s,x)=>s+x.tarifa,0))));
    t.appendChild(izq);
    t.appendChild(el('small','',fmt(b.fecha)));
    t.onclick=()=>verDetalle(b.bid);
    c.appendChild(t);
  }
}

async function verDetalle(bid){
  const b=(await todos('barcos')).find(x=>x.bid===bid);if(!b)return;
  const v=(await todos('vehiculos')).filter(x=>x.barcoId===bid).sort((a,b)=>b.num-a.num);
  urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
  const d=$('detalle');d.innerHTML='';
  const caja=el('div','caja');caja.style.marginTop='0';
  const h=el('h2','',b.tipo);h.style.fontSize='1.3rem';
  h.appendChild(el('span','tag '+(b.abierto?'ab':'ce'),b.abierto?'Abierto':'Cerrado'));
  caja.appendChild(h);
  caja.appendChild(el('small','','Código de barras: '+(b.codigoBarras||'—')));
  caja.appendChild(el('br'));
  caja.appendChild(el('small','','Código numérico: '+(b.codigoNum||'—')));
  caja.appendChild(el('br'));
  caja.appendChild(el('small','','Abierto: '+fmt(b.fecha)+(b.cierre?' · Cerrado: '+fmt(b.cierre):'')));
  const st=el('div','stats');
  const total=v.reduce((s,x)=>s+x.tarifa,0);
  const a=el('div','stat');a.appendChild(el('b','',String(v.length)));a.appendChild(el('span','','vehículos'));
  const m=el('div','stat');m.appendChild(el('b','',rd(total)));m.appendChild(el('span','','total'));
  st.appendChild(a);st.appendChild(m);caja.appendChild(st);
  // desglose por tarifa (ej. Sucha: RD$200 × 3, RD$400 × 2)
  const g={};v.forEach(x=>g[x.tarifa]=(g[x.tarifa]||0)+1);
  const claves=Object.keys(g).sort((x,y)=>x-y);
  if(claves.length)caja.appendChild(el('p','',claves.map(k=>g[k]+' × '+rd(Number(k))+' = '+rd(g[k]*k)).join('  ·  ')));
  const bt=el('button','sec2',b.abierto?'Cerrar barco':'Reabrir barco');
  bt.onclick=async()=>{
    if(b.abierto){
      if(!confirm('¿Cerrar el barco '+nombreBarco(b)+'?'))return;
      await estadoBarcoDB(bid,false);aviso('Barco cerrado');
    }else{
      const dup=(await todos('barcos')).find(o=>o.abierto&&o.bid!==bid&&((b.codigoBarras&&o.codigoBarras===b.codigoBarras)||(b.codigoNum&&o.codigoNum===b.codigoNum)));
      if(dup){aviso('Ya hay otro barco abierto con ese código');return;}
      await estadoBarcoDB(bid,true);aviso('Barco reabierto');
    }
    await verDetalle(bid);
  };
  caja.appendChild(bt);d.appendChild(caja);
  d.appendChild(el('h2','','Vehículos de este barco')).style.margin='20px 0 4px';
  const ul=el('ul');
  if(!v.length)ul.appendChild(el('div','vacio','Todavía no tiene vehículos.'));
  v.forEach(x=>ul.appendChild(filaVeh(x,false)));
  d.appendChild(ul);
  mostrar('pDetalle');
}

function estado(){const e=$('estado');e.textContent=navigator.onLine?'Con internet':'Sin internet';e.className=navigator.onLine?'on':'off';}
addEventListener('online',estado);addEventListener('offline',estado);estado();
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
abrirDB().then(pintar);
</script>
